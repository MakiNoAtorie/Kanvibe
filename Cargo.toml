[package]
name = "kanvibe"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
dirs = "7.0.0"
display-info = "0.5.10"
iced = { version = "0.14", features = ["markdown", "highlighter", "selector", "tokio"] }
jiff = "0.2"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

# Keep target/ small: no debug info for dependencies, line tables only for our crate.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
